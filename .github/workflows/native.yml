# Qualification-only branch. Never merge this workflow into main.
name: PR17 Native Performance Qualification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  performance:
    name: Builder performance / native
    runs-on: xcode-27
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B Scripts/qualify_schema_builder_performance.py
      - name: Preserve native performance receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr17-builder-performance
          if-no-files-found: error
          retention-days: 30
          path: .build/pr17-performance/results/
