name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: Native / ${{ matrix.lane }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [native, safety, docs]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - run: python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .build/ci/
            .build/handoff/docc/receipt.json
            .build/handoff/docc/coverage.json
            .build/handoff/docc/symbols/
            .build/handoff/docc/compiled-catalogs.tar.gz
            .build/handoff/docc/compiled-catalogs.MANIFEST.sha256
            .build/handoff/docc/*-diagnostics.json
            .build/handoff/docc/*.log
            .build/handoff/pages/receipt.json
            .build/handoff/pages/site.MANIFEST.sha256
            .build/handoff/pages/*.log
      - name: Package qualified documentation site
        if: matrix.lane == 'docs'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: .build/handoff/pages/site
          include-hidden-files: true # Preserve the verified .nojekyll file; only the generated site is uploaded.
  publish:
    name: Documentation / publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: qualification
    # Native compilation and all qualification happened in the jobs above.
    # This job only publishes their exact static artifact.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish qualified documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
