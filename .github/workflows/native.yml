name: Native CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: Native / ${{ matrix.lane }}
    runs-on: xcode-27
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [native, safety, docs]
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'
      - name: Preserve native receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: native-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .build/ci/
            .build/handoff/docc/receipt.json
            .build/handoff/docc/*-diagnostics.json
            .build/handoff/docc/*.log
