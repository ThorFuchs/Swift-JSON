name: Linux CI
on:
  push:
    branches: [main, 'release/1.6']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  qualification:
    name: Linux execution / ${{ matrix.architecture }} / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [linux, linux-safety, composition]
        architecture: [x86_64, arm64]
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm
    container:
      # Official Swift 6.4.0 Ubuntu 24.04 multi-architecture OCI index.
      image: swift@sha256:31d14d727f4451f25e29bac9c42563a098c39ac66415e8bad970f48038e38aca
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      # Use the hosted tool cache rather than requiring live Ubuntu mirrors.
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.16'
      - name: Verify the CI harness interpreter
        run: |
          python3 --version
          python3 -c 'import ctypes, hashlib, json, sqlite3, ssl, subprocess, tarfile; print("Python runtime imports passed")'
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify the checked-out container workspace
        run: |
          # The image user differs from the checkout owner. Trust this exact
          # ephemeral workspace so Git identity and full-history checks run.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - run: python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'
      - name: Preserve Linux receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-${{ matrix.architecture }}-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .build/ci/
            !.build/ci/**/reproduction/extracted/**
  required:
    # Both architectures and all three lanes must succeed. Preserve the four
    # existing context names without converting an incomplete matrix to green.
    name: Linux / ${{ matrix.architecture }} / ${{ matrix.lane }}
    needs: qualification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lane: [linux, linux-safety]
        architecture: [x86_64, arm64]
    steps:
      - name: Require complete qualification
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success
