name: Linux CI
on:
  push:
    branches: [main, 'release/1.6']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qualification:
    name: Linux execution / ${{ matrix.architecture }} / ${{ matrix.lane }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane: [linux, linux-safety, composition]
        architecture: [x86_64, arm64]
        include:
          - architecture: x86_64
            runner: ubuntu-24.04
          - architecture: arm64
            runner: ubuntu-24.04-arm

    env:
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Swift toolchain
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: '6.4.0'

      - name: Configure Python for CI harness
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Verify the checked-out container workspace
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - run: python3 -B Scripts/ci.py --lane '${{ matrix.lane }}'

      - name: Preserve Linux receipts
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: linux-${{ matrix.architecture }}-${{ matrix.lane }}
          if-no-files-found: error
          retention-days: 30
          path: |
            .build/ci/
            !.build/ci/**/reproduction/extracted/**

  required:
    name: Linux / ${{ matrix.architecture }} / ${{ matrix.lane }}
    needs: qualification
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        lane: [linux, linux-safety]
        architecture: [x86_64, arm64]
    steps:
      - name: Require complete qualification
        env:
          QUALIFICATION_RESULT: ${{ needs.qualification.result }}
        run: test "$QUALIFICATION_RESULT" = success
