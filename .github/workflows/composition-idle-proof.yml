name: PR35 composition idle proof
on:
  push:
    branches: [codex/composition-idle-proof]
permissions:
  contents: read
concurrency:
  group: pr35-idle-proof-${{ github.ref }}
  cancel-in-progress: false
jobs:
  compare:
    name: PR35 / controlled native Release
    runs-on: xcode-27
    timeout-minutes: 40
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer
      SDKROOT: /Applications/Xcode_27.2.app/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compare pinned inputs after both Release builds finish
        run: python3 -B Scripts/qualify_composition_idle.py --output .build/ci/pr35-idle-proof --wait-seconds 180
      - name: Preserve measurements and host eligibility
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr35-idle-proof
          if-no-files-found: error
          retention-days: 30
          path: .build/ci/pr35-idle-proof/
